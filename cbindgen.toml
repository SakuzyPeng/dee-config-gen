language = "C"
include_guard = "DEE_CONFIG_GEN_FFI_H"
pragma_once = false
documentation = false
usize_is_size_t = true
no_includes = true
autogen_warning = "/* This file is generated by cbindgen. Do not edit manually. */"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
after_includes = """
#define DCG_FFI_ABI_VERSION 1
#define DCG_FFI_HEADER_VERSION 10100
#define DCG_FFI_HEADER_VERSION_STR "1.1.0"

#define DCG_STATUS_OK DCG_STATUS_CODE_OK
#define DCG_STATUS_INVALID_ARGUMENT DCG_STATUS_CODE_INVALID_ARGUMENT
#define DCG_STATUS_PARSE_ERROR DCG_STATUS_CODE_PARSE_ERROR
#define DCG_STATUS_RESOLVE_ERROR DCG_STATUS_CODE_RESOLVE_ERROR
#define DCG_STATUS_RENDER_ERROR DCG_STATUS_CODE_RENDER_ERROR
#define DCG_STATUS_INTERNAL_ERROR DCG_STATUS_CODE_INTERNAL_ERROR
#define DCG_STATUS_PANIC DCG_STATUS_CODE_PANIC

#define DCG_RENDER_FORMAT_XML DcgRenderFormat_XML
#define DCG_RENDER_FORMAT_JSON DcgRenderFormat_JSON
"""

[parse]
parse_deps = false
clean = true
include = ["dee-config-gen"]

[export]
item_types = ["functions", "enums", "structs", "typedefs"]
include = [
  "DcgStatusCode",
  "DcgRenderFormat",
  "DcgStringView",
  "DcgOwnedString",
  "DcgResolveOptions",
  "DcgGenerateOptions",
  "DcgError",
  "DcgValidateOutput",
  "DcgGenerateOutput",
  "dcg_abi_version",
  "dcg_validate_job",
  "dcg_generate_config",
  "dcg_free_string",
  "dcg_free_validate_output",
  "dcg_free_generate_output",
  "dcg_free_error",
]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
