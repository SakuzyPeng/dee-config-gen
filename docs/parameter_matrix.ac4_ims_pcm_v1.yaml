template_id: ac4_ims_pcm_v1
description: Official-first Dolby AC-4 immersive stereo template for PCM WAV or WAV-list inputs and XML/JSON output to .ac4 or .mp4.
profiles:
  - standard
  - music
encode_modes:
  - ac4
input:
  type: wav or wav_list
output:
  type: ac4 or mp4
notes:
  - This template requires the inputs block and accepts exactly one of inputs.wav or inputs.wav_list.
  - inputs.wav currently requires a single 5.1 WAV input.
  - inputs.wav_list currently requires 6 mono WAV stems mapped as a 5.1 source.
  - Official input timing overrides `input_timecode_frame_rate`, `offset`, and `ffoa` are supported and are used by runtime coverage for embedded-timecode scenarios.
  - PCM embedded-timecode runtime coverage no longer depends on extra local fixtures; ignored tests generate a 5.1 WAV or mono stems and drive embedded semantics through the official input timing parameters.
  - Set `output.container=mp4` to render `output/mp4`; the v1 XML branch writes `output_format=mp4`, `override_frame_rate=no`, and `fill_video=false`.
  - Local DEE 5.2.1 runtime smoke now verifies both `.ac4` and `.mp4` outputs on the PCM lane for XML and native JSON.
parameters:
  - key: metering_mode
    type: enum
    values: [1770-1, 1770-2, 1770-3, 1770-4, LeqA]
    default: 1770-4
    source: official
  - key: dialogue_intelligence
    type: bool
    default: true
    source: official
  - key: speech_threshold
    type: int_range
    min: 0
    max: 100
    default: 15
    source: official
  - key: data_rate
    type: enum
    values: [64, 72, 112, 144, 256, 320]
    default: 256
    source: official
  - key: timecode_frame_rate
    type: enum
    values: [not_indicated, 23.976, 24, 25, 29.97, 30, 48, 50, 59.94, 60]
    default: not_indicated
    source: official
  - key: start
    type: string
    default: first_frame_of_action
    accepted_formats: [first_frame_of_action, HH:MM:SS:FF, HH:MM:SS:FFdf, HH:MM:SS.xx]
    source: official
  - key: end
    type: string
    default: end_of_file
    accepted_formats: [end_of_file, HH:MM:SS:FF, HH:MM:SS:FFdf, HH:MM:SS.xx]
    source: official
  - key: time_base
    type: enum
    values: [file_position, embedded_timecode]
    default: file_position
    source: official
  - key: prepend_silence_duration
    type: string
    default: '0'
    accepted_formats: [seconds, seconds.milliseconds]
    source: official
  - key: append_silence_duration
    type: string
    default: '0'
    accepted_formats: [seconds, seconds.milliseconds]
    source: official
  - key: ac4_frame_rate
    type: enum
    values: [native, 23.976, 24, 25, 29.97]
    default: native
    source: official
  - key: ims_legacy_presentation
    type: bool
    default: false
    source: official
  - key: iframe_interval
    type: int_range
    min: 0
    max: 1000
    default: 0
    source: official
  - key: language
    type: string
    default: ''
    source: official
  - key: encoding_profile
    type: enum
    values: [ims, ims_music]
    default: ims
    source: official
  - key: ddp_drc_profile
    type: enum
    values: [film_standard, film_light, music_standard, music_light, speech, none]
    default: film_light
    source: official
  - key: flat_panel_drc_profile
    type: enum
    values: [film_standard, film_light, music_standard, music_light, speech, none]
    default: film_light
    source: official
  - key: home_theatre_drc_profile
    type: enum
    values: [film_standard, film_light, music_standard, music_light, speech, none]
    default: film_light
    source: official
  - key: portable_hp_drc_profile
    type: enum
    values: [film_standard, film_light, music_standard, music_light, speech, none]
    default: film_light
    source: official
  - key: portable_spkr_drc_profile
    type: enum
    values: [film_standard, film_light, music_standard, music_light, speech, none]
    default: film_light
    source: official
