template_id: atmos_ec3_v1
summary:
  profile: [standard, music]
  job_mode: [single, album]
  encode_mode: [streaming, bluray, ddp71]
  fixed_policy:
    profile_music:
      default_locked: true
      fields:
        dialogue_intelligence: false
        speech_threshold: 100
        line_mode_drc_profile: music_light
        rf_mode_drc_profile: music_light
      unlock_flag: --allow-fixed-override
  data_rate:
    streaming: [384, 448, 576, 640, 768, 1024]
    bluray: [1152, 1280, 1408, 1512, 1536, 1664]
    ddp71: [384, 448, 576, 640, 704, 768, 832, 896, 960, 1008, 1024, 1280, 1536, 1664]
    hard_max: 1664

parameters:
  - key: metering_mode
    type: enum
    allowed: [1770-1, 1770-2, 1770-3, 1770-4, LeqA]
    default: 1770-4
    sources: [dolby_official, deezy_observed]
    note: Loudness measuring mode.
  - key: dialogue_intelligence
    type: bool
    default: true
    sources: [dolby_official, deezy_observed]
    note: Ignored for 1770-1/LeqA.
  - key: speech_threshold
    type: int
    range: [0, 100]
    default: 15
    sources: [dolby_official, deezy_observed]
    note: Speech gating threshold percent.
  - key: data_rate
    type: int
    sources: [dolby_official, deew_observed, deezy_observed]
    note: Mode-specific bitrate set; hard max 1664.
  - key: timecode_frame_rate
    type: enum
    allowed: [not_indicated, 23.976, 24, 25, 29.97, 30, 48, 50, 59.94, 60]
    default: not_indicated
    sources: [dolby_official]
  - key: start
    type: string
    default: first_frame_of_action
    sources: [dolby_official]
  - key: end
    type: string
    default: end_of_file
    sources: [dolby_official]
  - key: time_base
    type: enum
    allowed: [file_position, embedded_timecode]
    default: file_position
    sources: [dolby_official]
  - key: prepend_silence_duration
    type: string
    default: '0.0'
    sources: [dolby_official]
  - key: append_silence_duration
    type: string
    default: '0.0'
    sources: [dolby_official]
  - key: line_mode_drc_profile
    type: enum
    allowed: [film_standard, film_light, music_standard, music_light, speech, none]
    default: film_light
    sources: [dolby_official, deew_observed, deezy_observed]
  - key: rf_mode_drc_profile
    type: enum
    allowed: [film_standard, film_light, music_standard, music_light, speech, none]
    default: film_light
    sources: [dolby_official, deew_observed, deezy_observed]
  - key: loro_center_mix_level
    type: enum
    allowed: ['+3', '+1.5', '0', '-1.5', '-3', '-4.5', '-6', -inf]
    default: -3
    sources: [dolby_official]
  - key: loro_surround_mix_level
    type: enum
    allowed: ['-1.5', '-3', '-4.5', '-6', -inf]
    default: -3
    sources: [dolby_official]
  - key: ltrt_center_mix_level
    type: enum
    allowed: ['+3', '+1.5', '0', '-1.5', '-3', '-4.5', '-6', -inf]
    default: -3
    sources: [dolby_official]
  - key: ltrt_surround_mix_level
    type: enum
    allowed: ['-1.5', '-3', '-4.5', '-6', -inf]
    default: -3
    sources: [dolby_official]
  - key: preferred_downmix_mode
    type: enum
    allowed: [not_indicated, loro, ltrt, ltrt-pl2]
    default: loro
    sources: [dolby_official]
  - key: surround_trim_5_1
    type: enum
    allowed: ['0', '-3', '-6', '-9', auto]
    default: auto
    sources: [dolby_official]
  - key: surround_trim_7_1
    type: enum
    allowed: ['0', '-3', '-6', '-9', auto]
    default: auto
    mode: ddp71
    sources: [deew_observed]
    note: Community-observed hidden parameter for non-Atmos 7.1 workflows.
  - key: height_trim_5_1
    type: enum
    allowed: ['-3', '-6', '-9', '-12', auto]
    default: auto
    sources: [dolby_official]
  - key: custom_dialnorm
    type: int
    range: [-31, 0]
    default: 0
    sources: [dolby_official, deew_observed, deezy_observed]
  - key: encoding_backend
    type: enum
    allowed: [atmosprocessor]
    default: atmosprocessor
    mode: bluray
    sources: [deew_observed, deezy_observed]
    note: Community-observed bluray extension.
  - key: encoder_mode
    type: enum
    allowed: [bluray, ddp71]
    default:
      bluray: bluray
      ddp71: ddp71
    mode: [bluray, ddp71]
    sources: [deew_observed, deezy_observed]
    note: Community-observed mode extension parameter.
