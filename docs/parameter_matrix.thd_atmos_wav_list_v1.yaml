template_id: thd_atmos_wav_list_v1
description: Official-first mixed-input TrueHD template modeled on encode_to_dthd with atmos_mezz + wav_list input and mlp output.
profiles:
  - standard
  - music
encode_modes:
  - mlp
input:
  type: mixed
  groups:
    - atmos_mezz
    - wav_list
output:
  type: mlp
notes:
  - v1 covers only the official atmos_mezz + wav_list -> encode_to_dthd -> mlp path.
  - User input must use the inputs block; legacy top-level input is rejected for this template.
  - inputs.atmos_mezz.file_names must contain exactly one file.
  - inputs.wav_list.file_names uses ordered mono stems and defaults channel_configuration to auto.
  - public wav_list support is intentionally narrower than the official wav_list reference: only stereo, 5.1, and 7.1 are accepted.
  - mono and "-" placeholders are intentionally rejected because DEE 5.2.1 does not accept them on the tested XML path.
  - output mp4 remains intentionally out of scope for TrueHD workflows.
parameters:
  - key: channel_configuration
    type: enum
    values: [stereo, 5.1, 7.1, auto]
    default: auto
    source: official+local_runtime_guard
  - key: input_timecode_frame_rate
    type: enum
    values: [not_indicated, 23.976, 24, 25, 29.97, 30, 48, 50, 59.94, 60]
    default: not_indicated
    source: official
  - key: offset
    type: string
    default: auto
    accepted_formats:
      - auto
      - HH:MM:SS:FF
      - HH:MM:SS:FFdf
      - HH:MM:SS.xx
    source: official
  - key: ffoa
    type: string
    default: auto
    accepted_formats:
      - auto
      - HH:MM:SS:FF
      - HH:MM:SS:FFdf
      - HH:MM:SS.xx
    source: official
  - key: metering_mode
    type: enum
    values: [1770-1, 1770-2, 1770-3, 1770-4, LeqA]
    default: 1770-4
    source: official
  - key: dialogue_intelligence
    type: bool
    default: true
    source: official
  - key: speech_threshold
    type: int_range
    min: 0
    max: 100
    default: 15
    source: official
  - key: timecode_frame_rate
    type: enum
    values: [not_indicated, 23.976, 24, 25, 29.97, 30, 48, 50, 59.94, 60]
    default: not_indicated
    source: official
  - key: starting_timecode
    type: string
    default: off
    accepted_formats:
      - off
      - auto
      - HH:MM:SS:FF
      - HH:MM:SS:FFdf
      - HH:MM:SS.xx
    source: official
  - key: frame_rate
    type: enum
    values: [auto, 23.976, 24, 25, 29.97, 30]
    default: auto
    source: official
  - key: start
    type: string
    default: first_frame_of_action
    accepted_formats:
      - first_frame_of_action
      - HH:MM:SS:FF
      - HH:MM:SS:FFdf
      - HH:MM:SS.xx
    source: official
  - key: end
    type: string
    default: end_of_file
    accepted_formats:
      - end_of_file
      - HH:MM:SS:FF
      - HH:MM:SS:FFdf
      - HH:MM:SS.xx
    source: official
  - key: time_base
    type: enum
    values: [file_position, embedded_timecode]
    default: file_position
    source: official
  - key: prepend_silence_duration
    type: string
    default: '0'
    accepted_formats:
      - seconds
      - seconds.milliseconds
    source: official
  - key: append_silence_duration
    type: string
    default: '0'
    accepted_formats:
      - seconds
      - seconds.milliseconds
    source: official
  - key: custom_dialnorm
    type: int_range
    min: -31
    max: 0
    default: 0
    source: official
  - key: atmos_presentation_drc_profile
    type: enum
    values: [film_standard, film_light, music_standard, music_light, speech]
    default: film_light
    source: official
  - key: spatial_clusters
    type: enum
    values: [12, 14, 16]
    default: 12
    source: official
  - key: legacy_authoring_compatibility
    type: bool
    default: true
    source: official
  - key: presentation_8ch_drc_profile
    type: enum
    values: [film_standard, film_light, music_standard, music_light, speech]
    default: film_light
    source: official
  - key: presentation_6ch_drc_profile
    type: enum
    values: [film_standard, film_light, music_standard, music_light, speech]
    default: film_light
    source: official
  - key: presentation_2ch_drc_profile
    type: enum
    values: [film_standard, film_light, music_standard, music_light, speech]
    default: film_light
    source: official
  - key: optimize_data_rate
    type: bool
    default: false
    source: official
fixed_xml_fields:
  presentation_8ch:
    surround_3db_attenuation: true
  presentation_6ch:
    surround_3db_attenuation: true
  presentation_2ch:
    drc_default_on: true
    format: stereo
  atmos_mezz_input:
    timecode_frame_rate: not_indicated
    offset: auto
    ffoa: auto
  log_format: txt
