- template: thd_v1
  notes:
    - thd_v1 is the official-first TrueHD template for atmos_mezz -> encode_to_dthd -> mlp.
    - output mp4 is not exposed because DEE 5.2.1 rejects encode_to_dthd -> output/mp4 at workflow construction, and native mp4muxer rejects mlp input.
    - silence duration runtime coverage is now explicit for decimal-second values; frame syntax remains intentionally out of scope.
    - no dedicated music-profile lock was found in official TrueHD docs/XSD, and a runtime smoke for profile=music passes unchanged.
    - public TrueHD parameters now include spatial_clusters, legacy_authoring_compatibility, optimize_data_rate, and embedded output timecodes; log_format remains fixed.
