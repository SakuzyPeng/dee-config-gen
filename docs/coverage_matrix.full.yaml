version: 1
status_values: [covered, conservative_gap, unsupported_or_hidden]
layers: [schema, xsd_contract, runtime, knowledge_pitfall]
maintenance_rules:
  - Update this matrix whenever a new runtime conclusion is added.
  - Use unsupported_or_hidden only for XSD-missing hidden extensions or runtime-confirmed unsupported properties.
  - Use conservative_gap only when runtime verification is partial or the local schema intentionally stays narrower or wider than runtime.
templates:
- template: atmos_ec3_v1
  notes:
    - Official Atmos parameters default to runtime=conservative_gap unless they have dedicated DEE 5.2.1 runtime matrices.
    - encoding_backend and encoder_mode are runtime-verified hidden bluray extensions and are unsupported on streaming.
    - Low-value tail parameters now have representative runtime smoke coverage; they remain conservative_gap unless a full mode/value matrix exists.
