version: 1
status_values: [covered, conservative_gap, unsupported_or_hidden]
layers: [schema, xsd_contract, runtime, knowledge_pitfall]
maintenance_rules:
  - Update this matrix whenever a new runtime conclusion is added.
  - Use unsupported_or_hidden only for XSD-missing hidden extensions or runtime-confirmed unsupported properties.
  - Use conservative_gap only when runtime verification is partial or the local schema intentionally stays narrower or wider than runtime.
templates:
- template: ac4_ims_atmos_v1
  notes:
    - AC-4 IMS atmos lane models the official encode_to_ims_ac4 filter with atmos_mezz-family inputs and XML output to `.ac4` or `.mp4`.
    - Runtime smoke, control and DRC matrices, a dedicated time_base matrix, and a timecode_frame_rate matrix now run against local DEE 5.2.1 with the AC-4 package installed.
    - Embedded-timecode runs are valid only when start/end stay at or after the input's embedded start time.
    - Runtime suites now serialize DEE invocations inside the test binary; iframe_interval remains a conservative_gap because runtime rejects value 1 even though the official docs describe 0-1000.
    - Local MP4 smoke now verifies the v1 `output/mp4` branch with `output_format=mp4`, `override_frame_rate=no`, and `fill_video=false`; JSON remains intentionally unsupported.
  parameters:
    - param: metering_mode
      modes: {ac4: {schema: covered, xsd_contract: covered, runtime: covered, knowledge_pitfall: covered}}
    - param: dialogue_intelligence
      modes: {ac4: {schema: covered, xsd_contract: covered, runtime: covered, knowledge_pitfall: covered}}
    - param: speech_threshold
      modes: {ac4: {schema: covered, xsd_contract: covered, runtime: covered, knowledge_pitfall: covered}}
    - param: data_rate
