name: ffi-release

# Builds C ABI and UniFFI release bundles when a version tag is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-and-package:
    name: ffi-release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_id: linux
            python_cmd: python3
            cmake_library: target/release/libdee_config_gen.so
            cmake_dll: ""
            package_lib: target/release/libdee_config_gen.so
            package_aux: ""
            package_consumer_library: libdee_config_gen.so
            package_consumer_dll: ""
            zip_name: dee-config-gen-ffi-linux.zip
            python_zip_name: dee-config-gen-uniffi-python-linux.zip
          - os: macos-latest
            target_id: macos
            python_cmd: python3
            cmake_library: target/release/libdee_config_gen.dylib
            cmake_dll: ""
            package_lib: target/release/libdee_config_gen.dylib
            package_aux: ""
            package_consumer_library: libdee_config_gen.dylib
            package_consumer_dll: ""
            zip_name: dee-config-gen-ffi-macos.zip
            python_zip_name: dee-config-gen-uniffi-python-macos.zip
          - os: windows-latest
            target_id: windows
            python_cmd: python
            cmake_library: target/release/dee_config_gen.dll.lib
            cmake_dll: target/release/dee_config_gen.dll
            package_lib: target/release/dee_config_gen.dll
            package_aux: target/release/dee_config_gen.dll.lib
            package_consumer_library: dee_config_gen.dll.lib
            package_consumer_dll: dee_config_gen.dll
            zip_name: dee-config-gen-ffi-windows.zip
            python_zip_name: dee-config-gen-uniffi-python-windows.zip

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Cargo and target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-ffi-v1-release-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('cbindgen.toml', '.github/workflows/ffi-release.yml') }}
          restore-keys: |
            ${{ runner.os }}-ffi-v1-release-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-ffi-v1-release-cargo-

      - name: Install cbindgen
        run: |
          if ! command -v cbindgen >/dev/null 2>&1; then
            cargo install cbindgen --version 0.29.2 --locked
          fi

      - name: Install uniffi-bindgen
        run: |
          if ! command -v uniffi-bindgen >/dev/null 2>&1; then
            cargo install uniffi --version 0.31.0 --locked --features cli
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run library tests
        run: cargo test --lib

      - name: Run FFI integration tests
        run: cargo test --test ffi_integration

      - name: Run FFI ABI contract tests
        run: cargo test --test ffi_abi_contract

      - name: Run UniFFI contract tests
        run: cargo test --test uniffi_contract

      - name: Build release artifacts
        run: cargo build --release

      - name: Build UniFFI bridge artifacts
        run: cargo build -p dee-config-gen-uniffi-bridge --release

      - name: Check generated FFI header
        run: scripts/check_ffi_header.sh

      - name: Configure CMake example
        run: |
          cmake -S ffi/example_cmake -B ffi/example_cmake/build \
            -DDCG_INCLUDE_DIR="${GITHUB_WORKSPACE}/include" \
            -DDCG_LIBRARY="${GITHUB_WORKSPACE}/${{ matrix.cmake_library }}" \
            -DDCG_DLL="${GITHUB_WORKSPACE}/${{ matrix.cmake_dll }}"

      - name: Build CMake example
        run: cmake --build ffi/example_cmake/build --config Release

      - name: Run CMake example test
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export PATH="${GITHUB_WORKSPACE}/target/release:${PATH}"
          fi
          ctest --test-dir ffi/example_cmake/build --output-on-failure -C Release

      - name: Package release archive
        id: package
        run: |
          STAGE_DIR="${RUNNER_TEMP}/ffi-package-${{ matrix.target_id }}"
          ZIP_PATH="${RUNNER_TEMP}/${{ matrix.zip_name }}"
          mkdir -p "${STAGE_DIR}/lib" "${STAGE_DIR}/include"
          cp "${GITHUB_WORKSPACE}/include/dee_config_gen_ffi.h" "${STAGE_DIR}/include/"
          cp "${GITHUB_WORKSPACE}/${{ matrix.package_lib }}" "${STAGE_DIR}/lib/"
          if [[ -n "${{ matrix.package_aux }}" ]]; then
            cp "${GITHUB_WORKSPACE}/${{ matrix.package_aux }}" "${STAGE_DIR}/lib/"
          fi

          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            install_name_tool -id "@rpath/${{ matrix.package_consumer_library }}" \
              "${STAGE_DIR}/lib/${{ matrix.package_consumer_library }}"
            PACKAGED_ID="$(otool -D "${STAGE_DIR}/lib/${{ matrix.package_consumer_library }}" | tail -n +2 | tr -d '[:space:]')"
            if [[ "${PACKAGED_ID}" != "@rpath/${{ matrix.package_consumer_library }}" ]]; then
              echo "unexpected packaged install name: ${PACKAGED_ID}" >&2
              exit 1
            fi
          fi

          STAGE_DIR="${STAGE_DIR}" ZIP_PATH="${ZIP_PATH}" python - <<'PY'
          import os
          import pathlib
          import zipfile

          stage = pathlib.Path(os.environ["STAGE_DIR"])
          zip_path = pathlib.Path(os.environ["ZIP_PATH"])

          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              for path in stage.rglob("*"):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage))
          PY

          echo "zip_path=${ZIP_PATH}" >>"${GITHUB_OUTPUT}"

      - name: Unpack archive and resolve packaged consumer paths
        id: unpack
        run: |
          UNPACK_DIR="${RUNNER_TEMP}/ffi-unpacked-${{ matrix.target_id }}"
          rm -rf "${UNPACK_DIR}"
          mkdir -p "${UNPACK_DIR}"
          ZIP_PATH="${{ steps.package.outputs.zip_path }}"

          UNPACK_DIR="${UNPACK_DIR}" ZIP_PATH="${ZIP_PATH}" python - <<'PY'
          import os
          import pathlib
          import zipfile

          unpack_dir = pathlib.Path(os.environ["UNPACK_DIR"])
          zip_path = pathlib.Path(os.environ["ZIP_PATH"])
          with zipfile.ZipFile(zip_path) as zf:
              zf.extractall(unpack_dir)
          PY

          INCLUDE_DIR="${UNPACK_DIR}/include"
          LIBRARY_PATH="${UNPACK_DIR}/lib/${{ matrix.package_consumer_library }}"
          if [[ ! -f "${INCLUDE_DIR}/dee_config_gen_ffi.h" ]]; then
            echo "missing packaged header under ${INCLUDE_DIR}" >&2
            exit 1
          fi
          if [[ ! -f "${LIBRARY_PATH}" ]]; then
            echo "missing packaged library artifact ${LIBRARY_PATH}" >&2
            exit 1
          fi

          echo "include_dir=${INCLUDE_DIR}" >>"${GITHUB_OUTPUT}"
          echo "library=${LIBRARY_PATH}" >>"${GITHUB_OUTPUT}"

          if [[ -n "${{ matrix.package_consumer_dll }}" ]]; then
            DLL_PATH="${UNPACK_DIR}/lib/${{ matrix.package_consumer_dll }}"
            if [[ ! -f "${DLL_PATH}" ]]; then
              echo "missing packaged dll artifact ${DLL_PATH}" >&2
              exit 1
            fi
            echo "dll=${DLL_PATH}" >>"${GITHUB_OUTPUT}"
          fi

      - name: Configure CMake example from packaged archive
        run: |
          cmake -S ffi/example_cmake -B ffi/example_cmake/build-from-zip \
            -DDCG_INCLUDE_DIR="${{ steps.unpack.outputs.include_dir }}" \
            -DDCG_LIBRARY="${{ steps.unpack.outputs.library }}" \
            -DDCG_DLL="${{ steps.unpack.outputs.dll }}"

      - name: Build CMake example from packaged archive
        run: cmake --build ffi/example_cmake/build-from-zip --config Release

      - name: Run CMake packaged-consumer test
        run: |
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            PACKAGED_EXE="ffi/example_cmake/build-from-zip/dee_config_gen_ffi_example"
            if otool -L "${PACKAGED_EXE}" | rg -F "${GITHUB_WORKSPACE}" >/dev/null; then
              echo "packaged macOS consumer leaked workspace dylib path" >&2
              otool -L "${PACKAGED_EXE}" >&2
              exit 1
            fi
          fi
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export PATH="$(dirname "${{ steps.unpack.outputs.dll }}"):${PATH}"
          fi
          ctest --test-dir ffi/example_cmake/build-from-zip --output-on-failure -C Release

      - name: Generate UniFFI Python bindings for bundle
        id: uniffi_generate
        run: |
          BINDINGS_DIR="${RUNNER_TEMP}/uniffi-python-bindings-${{ matrix.target_id }}"
          case "${RUNNER_OS}" in
            Linux)
              UNIFFI_LIB="${GITHUB_WORKSPACE}/target/release/libdcg_uniffi_bridge.so"
              ;;
            macOS)
              UNIFFI_LIB="${GITHUB_WORKSPACE}/target/release/libdcg_uniffi_bridge.dylib"
              ;;
            Windows)
              UNIFFI_LIB="${GITHUB_WORKSPACE}/target/release/dcg_uniffi_bridge.dll"
              ;;
            *)
              echo "unsupported RUNNER_OS=${RUNNER_OS}" >&2
              exit 1
              ;;
          esac
          if [[ ! -f "${UNIFFI_LIB}" ]]; then
            echo "missing uniffi bridge library: ${UNIFFI_LIB}" >&2
            exit 1
          fi

          bash ffi/example_python_uniffi/generate_bindings.sh \
            --skip-build \
            --lib-path "${UNIFFI_LIB}" \
            --out-dir "${BINDINGS_DIR}"
          echo "bindings_dir=${BINDINGS_DIR}" >>"${GITHUB_OUTPUT}"

      - name: Package UniFFI Python bundle
        id: package_python
        run: |
          PY_ZIP_PATH="${RUNNER_TEMP}/${{ matrix.python_zip_name }}"
          ${{ matrix.python_cmd }} ffi/example_python_uniffi/package_bundle.py \
            --bindings-dir "${{ steps.uniffi_generate.outputs.bindings_dir }}" \
            --output-zip "${PY_ZIP_PATH}" \
            --readme "${GITHUB_WORKSPACE}/ffi/example_python_uniffi/RELEASE_BUNDLE_README.md" \
            --smoke-script "${GITHUB_WORKSPACE}/ffi/example_python_uniffi/smoke.py"
          echo "python_zip_path=${PY_ZIP_PATH}" >>"${GITHUB_OUTPUT}"

      - name: Unpack and run UniFFI Python bundle smoke
        id: unpack_python
        run: |
          PY_UNPACK_DIR="${RUNNER_TEMP}/uniffi-python-unpacked-${{ matrix.target_id }}"
          rm -rf "${PY_UNPACK_DIR}"
          mkdir -p "${PY_UNPACK_DIR}"
          PY_ZIP_PATH="${{ steps.package_python.outputs.python_zip_path }}"

          PY_UNPACK_DIR="${PY_UNPACK_DIR}" PY_ZIP_PATH="${PY_ZIP_PATH}" ${{ matrix.python_cmd }} - <<'PY'
          import os
          import pathlib
          import zipfile

          unpack_dir = pathlib.Path(os.environ["PY_UNPACK_DIR"])
          zip_path = pathlib.Path(os.environ["PY_ZIP_PATH"])
          with zipfile.ZipFile(zip_path) as zf:
              zf.extractall(unpack_dir)
          PY

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export PATH="${PY_UNPACK_DIR}:${PATH}"
          fi
          ${{ matrix.python_cmd }} "${PY_UNPACK_DIR}/smoke.py" --bindings-dir "${PY_UNPACK_DIR}"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffi-package-${{ matrix.target_id }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package_python.outputs.python_zip_path }}
          if-no-files-found: error

  release:
    name: release
    needs: build-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ffi-package-*
          path: dist
          merge-multiple: true

      - name: Download CLI release assets for combined checksums
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          for attempt in {1..30}; do
            if ! assets="$(
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
                --jq '.assets[] | select(.name | startswith("dee-config-gen-cli-") and endswith(".zip")) | [.name, .url] | @tsv' \
                2>/dev/null
            )"; then
              assets=""
            fi
            count="$(printf '%s\n' "${assets}" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
            if [[ "${count}" == "3" ]]; then
              while IFS=$'\t' read -r name url; do
                if [[ -z "${name}" || -z "${url}" ]]; then
                  continue
                fi
                curl --fail --silent --show-error --location \
                  --header "Authorization: Bearer ${GH_TOKEN}" \
                  --header "Accept: application/octet-stream" \
                  --output "dist/${name}" \
                  "${url}"
              done <<<"${assets}"
              exit 0
            fi

            echo "Waiting for CLI release assets (${count}/3 found, attempt ${attempt}/30)..."
            sleep 20
          done

          echo "Missing CLI release assets; cannot publish combined SHA256SUMS.txt" >&2
          find dist -maxdepth 1 -type f -print >&2
          exit 1

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.zip | sort -k2 > SHA256SUMS.txt

      - name: Upload combined release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffi-release-bundle
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Dry-run summary
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Dry-run completed. Packaged artifacts:"
          ls -lh dist

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
