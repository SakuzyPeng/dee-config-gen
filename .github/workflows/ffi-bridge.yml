name: ffi-bridge

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  ffi-bridge:
    name: ffi-bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Cargo and target
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-ffi-v1-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('cbindgen.toml', '.github/workflows/ffi-bridge.yml') }}
          restore-keys: |
            ${{ runner.os }}-ffi-v1-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-ffi-v1-cargo-

      - name: Install cbindgen
        run: |
          if ! command -v cbindgen >/dev/null 2>&1; then
            cargo install cbindgen --version 0.29.2 --locked
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run library tests
        run: cargo test --lib

      - name: Run FFI integration tests
        run: cargo test --test ffi_integration

      - name: Run FFI ABI contract tests
        run: cargo test --test ffi_abi_contract

      - name: Run UniFFI contract tests
        run: cargo test --test uniffi_contract

      - name: Build release artifacts
        run: cargo build --release

      - name: Check generated FFI header
        run: scripts/check_ffi_header.sh

      - name: Resolve cdylib path
        id: cdylib
        run: |
          case "${RUNNER_OS}" in
            Linux)
              LIB="${GITHUB_WORKSPACE}/target/release/libdee_config_gen.so"
              ;;
            macOS)
              LIB="${GITHUB_WORKSPACE}/target/release/libdee_config_gen.dylib"
              ;;
            Windows)
              LIB="${GITHUB_WORKSPACE}/target/release/dee_config_gen.dll.lib"
              DLL="${GITHUB_WORKSPACE}/target/release/dee_config_gen.dll"
              ;;
            *)
              echo "unsupported RUNNER_OS=${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

          if [[ ! -f "${LIB}" ]]; then
            echo "missing library: ${LIB}" >&2
            exit 1
          fi
          echo "library=${LIB}" >>"${GITHUB_OUTPUT}"

          if [[ -n "${DLL:-}" ]]; then
            if [[ ! -f "${DLL}" ]]; then
              echo "missing dll: ${DLL}" >&2
              exit 1
            fi
            echo "dll=${DLL}" >>"${GITHUB_OUTPUT}"
          fi

      - name: Configure CMake example
        run: |
          cmake -S ffi/example_cmake -B ffi/example_cmake/build \
            -DDCG_INCLUDE_DIR="${GITHUB_WORKSPACE}/include" \
            -DDCG_LIBRARY="${{ steps.cdylib.outputs.library }}" \
            -DDCG_DLL="${{ steps.cdylib.outputs.dll }}"

      - name: Build CMake example
        run: cmake --build ffi/example_cmake/build --config Release

      - name: Run CMake example test
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export PATH="${GITHUB_WORKSPACE}/target/release:${PATH}"
          fi
          ctest --test-dir ffi/example_cmake/build --output-on-failure -C Release

  uniffi-python:
    name: uniffi-python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python_cmd: python3
          - os: macos-latest
            python_cmd: python3
          - os: windows-latest
            python_cmd: python

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Cargo and target
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-uniffi-v2-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('ffi/uniffi_bridge/Cargo.toml', 'ffi/uniffi_bridge/src/dcg_uniffi.udl', '.github/workflows/ffi-bridge.yml') }}
          restore-keys: |
            ${{ runner.os }}-uniffi-v2-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-uniffi-v2-cargo-

      - name: Install uniffi-bindgen
        run: |
          if ! command -v uniffi-bindgen >/dev/null 2>&1; then
            cargo install uniffi --version 0.31.0 --locked --features cli
          fi

      - name: Build UniFFI bridge
        run: cargo build -p dee-config-gen-uniffi-bridge --release

      - name: Generate UniFFI Python bindings
        run: bash ffi/example_python_uniffi/generate_bindings.sh

      - name: Run UniFFI Python smoke
        run: ${{ matrix.python_cmd }} ffi/example_python_uniffi/smoke.py

      - name: Windows DLL path smoke
        if: runner.os == 'Windows'
        run: |
          export PATH="${PWD}/ffi/example_python_uniffi/generated:${PATH}"
          ${{ matrix.python_cmd }} ffi/example_python_uniffi/smoke.py --bindings-dir ffi/example_python_uniffi/generated
